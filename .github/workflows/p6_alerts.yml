name: P6 Cross-Border Alert Engine

on:
  schedule:
    - cron: '0 0 * * 1'   # every Monday at 00:00 UTC
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  alerts:
    name: Generate & deliver cross-border alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: p6_api/alerts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install psycopg2-binary>=2.9 python-dotenv>=1.0

      - name: Run alert engine
        run: python alert_engine.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
