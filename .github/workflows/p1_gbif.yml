name: P1 GBIF Rodent Data

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of every month at 08:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  gbif:
    name: Refresh rodent occurrence → habitat_suitability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests>=2.32 \
            psycopg2-binary>=2.9 \
            python-dotenv>=1.0 \
            sentry-sdk>=2.0

      - name: Fetch GBIF rodent occurrence records
        run: python p1_warehouse/etl/gbif_rodent_etl.py
        env:
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          SENTRY_DSN:    ${{ secrets.SENTRY_DSN }}
