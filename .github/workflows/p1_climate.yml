name: P1 Climate Data (Open-Meteo)

on:
  schedule:
    - cron: '0 7 * * 1'   # every Monday 07:00 UTC — after P3 scanner (06:00)
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  climate:
    name: Fetch weekly climate → climate_weekly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests>=2.32 \
            psycopg2-binary>=2.9 \
            python-dotenv>=1.0 \
            sentry-sdk>=2.0

      - name: Fetch current-year climate (all 37 states)
        run: python p1_warehouse/etl/openmeteo_climate_etl.py --year $(date +%Y)
        env:
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          SENTRY_DSN:    ${{ secrets.SENTRY_DSN }}
